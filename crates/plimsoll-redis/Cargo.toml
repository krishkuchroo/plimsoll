[package]
name = "plimsoll-redis"
description = "Redis store for plimsoll: atomic sliding window log in Lua"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
plimsoll-core = { workspace = true }
redis = { workspace = true, features = ["tokio-comp", "connection-manager", "script"] }
tokio = { workspace = true, features = ["rt", "time"] }
thiserror = { workspace = true }

[features]
# Exposes `RedisStore::check_at`, which pins the script's clock. Tests only.
test-clock = []

[dev-dependencies]
criterion = { version = "0.8", features = ["async_tokio"] }
# Self-dependency so integration tests always get `check_at`.
plimsoll-redis = { path = ".", features = ["test-clock"] }
proptest = "1.11.0"
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }

[[bench]]
name = "redis"
harness = false
