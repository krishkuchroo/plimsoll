[workspace]
resolver = "3"
members = [
    "crates/plimsoll-core",
    "crates/plimsoll-redis",
    "crates/plimsoll",
    "examples/axum-demo",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/krishkuchroo/plimsoll"
authors = ["Krish Kuchroo"]
keywords = ["rate-limit", "rate-limiting", "redis", "distributed", "throttle"]
categories = ["web-programming", "asynchronous", "network-programming"]

[workspace.dependencies]
plimsoll-core = { version = "0.1.0", path = "crates/plimsoll-core" }
plimsoll-redis = { version = "0.1.0", path = "crates/plimsoll-redis" }
plimsoll = { version = "0.1.0", path = "crates/plimsoll" }

tokio = { version = "1.53", default-features = false }
redis = { version = "1.7", default-features = false }
thiserror = "2.0"
axum = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
